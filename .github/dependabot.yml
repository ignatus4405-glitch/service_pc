version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "microsoft/*"
          - "softprops/*"

  - package-ecosystem: "nuget"
    directory: "/build"
    schedule:
      interval: "weekly"
